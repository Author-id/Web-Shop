{% block header %}
{% load static %}
{% with request.resolver_match.view_name as view_name %}
{% load i18n %}
<header class="pt-2 px-2">
  <ul class="nav nav-pills">
    <li class="nav-item">
      <a class="nav-link {% if view_name == 'homepage:main' %} active {% endif %}" href="{% url 'homepage:main' %}">
        {% trans "Главная" %}
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if view_name == 'about:main' %} active {% endif %}" href="{% url 'about:main' %}">
        {% trans "О проекте" %}
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if view_name == 'catalog:main' %} active {% endif %}" href="{% url 'catalog:main' %}">
        {% trans "Список товаров" %}
      </a>
    </li>
  </ul>
</header>
{% endwith %}
{% endblock %}
