stages:
  - linting
  - testing


flake8:
  stage: linting
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - pip install flake8 pep8-naming flake8-import-order flake8-quotes
    - flake8 --inline-quotes '"' --exclude venv lyceum


black:
  stage: linting
  image: registry.gitlab.com/pipeline-components/black:latest
  script:
    - black --line-length 79 --exclude venv --check --skip-string-normalization --check .


test:
  stage: testing
  image: python:3.9
  script:
    - pip install -r requirements/prod.txt
    - cd lyceum
    - python manage.py test
