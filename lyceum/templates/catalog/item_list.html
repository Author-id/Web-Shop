{% extends "base.html" %}
{% load static %}

{% block title %}
  Каталог товаров
{% endblock %}

{% block content %}
  <h1 class="pb-2 mb-0">Список товаров</h1>
  <div class="row">
    <div class="col-6 col-md-4 my-1 d-flex align-items-stretch">
      <div class="card">
        <img
          class="img-fluid card-img-top"
          width="200"
          src='{% static "img/image-holder.png" %}'
          alt="сочная клубника"
        >
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Клубника</h5>
          <p class="card-text">
            Будет роскошно смотреться на любом столе, это мы гарантируем!
          </p>
          <button type="button" class="mt-auto btn btn-md btn-block btn-primary">
            Подробнее
          </button>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 my-1 d-flex align-items-stretch">
      <div class="card">
        <img
          class="img-fluid card-img-top"
          width="200"
          src='{% static "img/image-holder.png" %}'
          alt="не очень вкусные шампиньоны"
        >
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Шампиньоны</h5>
          <p class="card-text">
            Может быть даже вкусные!
          </p>
          <button type="button" class="mt-auto btn btn-md btn-block btn-primary">
            Подробнее
          </button>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
