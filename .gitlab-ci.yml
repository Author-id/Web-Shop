stages:
  - linting
  - test

flake8:
  stage: linting
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - pip install pep8-naming==0.13.3
    - pip install flake8-quotes==3.3.2
    - pip install flake8-import-order==0.18.2
    - pip install flake8-commas==2.1.0
    - pip install flake8-absolute-import==1.0.0.2
    - pip install flake8-eradicate==1.5.0
    - pip install flake8-comprehensions==3.14.0
    - pip install flake8-dunder-all==0.3.1
    - flake8 --verbose .


black:
  stage: linting
  image: registry.gitlab.com/pipeline-components/black:latest
  script:
    - black --check --verbose --line-length 79 -- .

django_test:
  stage: test
  image: python:3.10
  script:
    - pip install -r requirements/prod.txt
    -  pip install -r requirements/dev.txt
    - cd lyceum
    -  python manage.py makemigrations
    - python manage.py migrate
    - python manage.py test
