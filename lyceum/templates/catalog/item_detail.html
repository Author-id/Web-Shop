{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}
{% trans "О товаре" %}
{% endblock title %}

{% block content %}
  <h1 class="pb-2 mb-0">{% trans "Клубника" %}</h1>
  <div class="row mt-3">
    <div class="col-12 col-md-6">
      <h2>{% trans "Описание" %}</h2>
      <p>{% trans "Будет роскошно смотреться на любом столе, это мы гарантируем!" %}</p>
    </div>
    <div class="col-12 col-md-6 mb-3">
      <img
        class="img-fluid"
        height="400" width="300"
        src="{% static "img/image-holder.png" %}"
        alt={% trans "сочная клубника" %}
      >
    </div>
  </div>
{% endblock content %}
