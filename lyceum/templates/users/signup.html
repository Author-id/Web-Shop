{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}
  {{ title }}
{% endblock %}

{% block content %}
  <link rel="stylesheet" href="{% static "css/main.css" %}">
  <h1>{{ title }}</h1>
  <form method="post" class="form-register">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Зарегестрироваться</button>
      <hr>
      <p>Уже зарегестрированы? <a href="{% url 'login' %}">Войти в личный кабинет</a></p>
  </form>
{% endblock %}
