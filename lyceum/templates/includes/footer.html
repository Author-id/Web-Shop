{% load i18n %}
<footer class="border-top text-center py-3">
  <p id="curryear">© {% now "Y" %}</p>
  <form action="{% url 'set_language' %}" method="post">{% csrf_token %}
    <input name="next" type="hidden" value="{{ redirect_to }}">
    <select class="btn btn-mini" name="language">
        {% get_current_language as LANGUAGE_CODE %}
        {% get_available_languages as LANGUAGES %}
        {% get_language_info_list for LANGUAGES as languages %}
        {% for language in languages %}
            <option value="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>
                {{ language.name_local }} ({{ language.code }})
            </option>
        {% endfor %}
    </select>
    <input class="mt-auto btn btn-md btn-block btn-primary" type="submit" value="Go">
  </form>
  <script>
      const curdate = Date("{% now "Y-m-d\TH:i:s\Z" %}");
      const curryearElement = document.getElementById("curryear");
      currDate = new Date();
      const dateDiff = Math.abs((curdate - currDate) / (3600 * 1000));
      if (dateDiff < 24) {
          curryearElement.textContent = String(currDate.getFullYear());
      }
    </script>
</footer>
