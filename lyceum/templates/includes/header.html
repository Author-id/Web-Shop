{% load static %}
{% load i18n %}
<header>
  <nav class="navbar navbar-light" style="background-color: #dedede">
    <div class="container">
      <a class="navbar-brand" href="{% url 'homepage:main' %}">
        <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
        {% trans "Супер-бренд" %}
      </a>
      {% with request.resolver_match.view_name as view_name %}
        <ul class="nav  nav-pills">
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'homepage:main' %} active {% endif %}" href="{% url 'homepage:main' %}">
              {% trans "Главная" %}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'about:description' %} active {% endif %}" href="{% url 'about:description' %}">
              {% trans "О проекте" %}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'catalog:item-list' %} active {% endif %}" href="{% url 'catalog:item-list' %}">
              {% trans "Список товаров" %}
            </a>
          </li>
        </ul>
      {% endwith %}
    </div>
  </nav>
</header>
