{% load static %}
{% load i18n %}
<div class="row">
  {% for item in items %}
  <div class="col-6 col-md-2 my-1">
    <div class="card" style="width: 18rem;">
      <img
        class="img-fluid card-img-top"
        width="100"
        src="{% static 'img/image-holder.png' %}"
        alt={% trans item.name %}
      >
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{% trans item.name %}</h5>
        <p class="card-text">
          {% trans item.text|truncatewords_html:10|safe %}
        </p>
        <p class="card-category">
          Категория: {% trans item.category.name|safe %}
        </p>
        <p class="card-tag">
          {% for tag in item.tags.all %}
          <p>Теги: {{ tag.name }}</p>
          {% endfor %}
        </p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
