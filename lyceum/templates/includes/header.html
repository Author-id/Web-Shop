{% load static %}
<header>
  <nav class="navbar navbar-light" style="background-color: #dedede">
    <div class="container">
      <a class="navbar-brand" href="{% url 'homepage:index' %}">
        <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
        Супер-бренд
      </a>
      {% with request.resolver_match.view_name as view_name %}
        <ul class="nav  nav-pills">
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'homepage:index' %} active {% endif %}" href="{% url 'homepage:index' %}">
              На главную
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'about:description' %} active {% endif %}" href="{% url 'about:description' %}">
              О проекте
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'catalog:item_list' %} active {% endif %}" href="{% url 'catalog:item_list' %}">
              Список товаров
            </a>
          </li>
        </ul>
      {% endwith %}
    </div>
  </nav>
</header>
